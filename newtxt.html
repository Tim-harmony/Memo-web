<!DOCTYPE html>
<html lang="zn-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建备忘录</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body {
            background-image: url("冰公主1.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            width: 60%;
            margin: 50px auto;
            text-align: center;
        }
        h2 {
            color: transparent;
            background: linear-gradient(45deg, #ffb6c1, #87cefa);
            -webkit-background-clip: text;
            background-clip: text;
            font-size: clamp(22px,3vw,32px);
        }
        /* 标题输入框 */
        .title-input {
            width: 100%;
            padding: 12px 16px;
            font-size: clamp(16px,1.8vw,20px);
            line-height: 1.5;
            border-radius: 12px;
            border: none;
            outline: none;
            background:rgba(255,255,255,0.22);
            backdrop-filter: blur(8px);
            color: #ffffff;  /*文字白色，适配深色背景*/
            margin-bottom:16px;
        }
        /* 正文可编辑盒子，和标题输入框参数完全对齐 */
        .editable-box {
            width: 100%;
            padding: 12px 16px;
            font-size: clamp(16px,1.8vw,20px);
            line-height: 1.5;
            border-radius: 12px;
            border: none;
            outline: none;
            text-align: left;
            background:rgba(255,255,255,0.22);
            backdrop-filter: blur(8px);
            color: #ffffff;  /*文字白色，适配深色背景*/
            margin-bottom:16px;
        }
        /*==== 占位文字颜色改成浅白色，适配磨砂框 ====*/
        .title-input::placeholder{
            color: #dddddd;
            opacity: 0.6;
        }
        .editable-box:empty:before {
            content: attr(data-placeholder);
            color: #aaaaaa;
            opacity: 0.8;
            font-size: inherit;
            line-height: inherit;
        }
        .btn-save, .btn-back {
            margin-top: 20px;
            padding: 14px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #9999aa, #7788aa);
            color: white;
            cursor: pointer;
            transition: 0.2s;
            margin: 10px;
        }
        .btn-save:hover,.btn-back:hover{
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>新建备忘录</h2>
        <!-- 标题框 -->
        <input type="text" id="noteTitle" class="title-input" placeholder="请输入备忘录标题">
        <!-- 正文框 -->
        <div id="noteInput" class="editable-box" contenteditable="true" data-placeholder="在这里输入你的备忘录内容..."></div>
        <br>
        <button class="btn-save" onclick="saveNote()">保存备忘录</button>
        <button class="btn-back" onclick="goBack()">返回主页</button>
    </div>
    <script>
        function saveNote(){
            let title = document.getElementById("noteTitle").value.trim();
            let content = document.getElementById("noteInput").innerText;
            if(!title){
                alert("请填写标题！");
                return;
            }
            if(!content.trim()){
                alert("内容不能为空！");
                return;
            }
            let noteList = JSON.parse(localStorage.getItem("notes")) || [];
            let newNote = {
                id: Date.now(),
                title: title,    
                content: content,
                time: new Date().toLocaleString()
            }
            noteList.push(newNote);
            localStorage.setItem("notes", JSON.stringify(noteList));
            alert("保存成功！");
            location.href = "index.html";
        }
        function goBack(){
            location.href = "index.html";
        }
    </script>
</body>
</html>
