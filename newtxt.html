<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建备忘录</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body {
            background-image: url("冰公主1.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            width: 60%;
            margin: 50px auto;
            text-align: center;
        }
        h2 {
            color: transparent;
            background: linear-gradient(45deg, #ffb6c1, #87cefa);
            -webkit-background-clip: text;
            background-clip: text;
            font-size: clamp(22px,3vw,32px);
        }
        /* 标题输入框 */
        .title-input {
            width: 100%;
            padding: 12px 16px;
            font-size: clamp(16px,1.8vw,20px);
            line-height: 1.5;
            border-radius: 12px;
            border: none;
            outline: none;
            background:rgba(255,255,255,0.22);
            backdrop-filter: blur(8px);
            color: #ffffff;
            margin-bottom:16px;
        }
        /* 正文可编辑盒子 */
        .editable-box {
            width: 100%;
            min-height:30vh;
            padding: 12px 16px;
            font-size: clamp(16px,1.8vw,20px);
            line-height: 1.5;
            border-radius: 12px;
            border: none;
            outline: none;
            text-align: left;
            background:rgba(255,255,255,0.22);
            backdrop-filter: blur(8px);
            color: #ffffff;
            margin-bottom:16px;
        }
        .title-input::placeholder{
            color: #dddddd;
            opacity: 0.6;
        }
        .editable-box:empty:before {
            content: attr(data-placeholder);
            color: #aaaaaa;
            opacity: 0.8;
            font-size: inherit;
            line-height: inherit;
        }
        .btn-wrap{
            display:flex;
            gap: 2vw;
            justify-content:center;
            margin-top:3vw;
        }
        .btn-save, .btn-back {
            padding: clamp(10px,2vw,16px) clamp(22px,4vw,36px);
            font-size: clamp(16px,2vw,22px);
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #9999aa, #7788aa);
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-save:hover,.btn-back:hover{
            transform: scale(1.05);
        }

        /* 右上角提示浮层 */
        .save-tip{
            position: fixed;
            top:20px;
            right:20px;
            padding:8px 14px;
            background:rgba(0,0,0,0.55);
            color:#89ff89;
            border-radius:8px;
            opacity:0;
            transition:opacity 0.3s;
            pointer-events:none;
            z-index:999;
        }
        .save-tip.show{
            opacity:1;
        }
    </style>
</head>
<body>
    <div class="save-tip" id="saveTip">✅已保存</div>

    <div class="container">
        <h2>新建备忘录</h2>
        <input type="text" id="noteTitle" class="title-input" placeholder="请输入备忘录标题">
        <div id="noteInput" class="editable-box" contenteditable="true" data-placeholder="在这里输入你的备忘录内容..."></div>

        <div class="btn-wrap">
            <button class="btn-save" onclick="saveNote()">保存备忘录</button>
            <button class="btn-back" onclick="goBack()">返回主页</button>
        </div>
    </div>

    <script>
        let autoSaveTimer = null;
        const SAVE_DELAY = 500;

        const titleEl = document.getElementById("noteTitle");
        const contentEl = document.getElementById("noteInput");
        const tipEl = document.getElementById("saveTip");

        window.onload = function(){
            const draftStr = localStorage.getItem("note_draft");
            if(draftStr){
                const draft = JSON.parse(draftStr);
                titleEl.value = draft.title || "";
                contentEl.innerText = draft.content || "";
            }
            titleEl.addEventListener("input", triggerAutoSave);
            contentEl.addEventListener("input", triggerAutoSave);
        }

        function triggerAutoSave(){
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(autoSaveDraft, SAVE_DELAY);
        }

        function autoSaveDraft(){
            const title = titleEl.value.trim();
            const content = contentEl.innerText;
            const draft = { title, content };
            localStorage.setItem("note_draft", JSON.stringify(draft));
            showSaveTip("✅草稿已自动保存");
        }

        function showSaveTip(text){
            tipEl.innerText = text;
            tipEl.classList.add("show");
            setTimeout(()=>{
                tipEl.classList.remove("show");
            },1200);
        }

        function saveNote(){
            let title = titleEl.value.trim();
            let content = contentEl.innerText;

            if(!title){
                showSaveTip("⚠️请填写标题！");
                return;
            }
            if(!content.trim()){
                showSaveTip("⚠️内容不能为空！");
                return;
            }

            // ✅清除残留定时器，防止保存后定时器继续写入草稿
            clearTimeout(autoSaveTimer);

            let noteList = JSON.parse(localStorage.getItem("notes")) || [];
            let newNote = {
                id: Date.now(),
                title: title,
                content: content,
                time: new Date().toLocaleString()
            }
            noteList.push(newNote);
            localStorage.setItem("notes", JSON.stringify(noteList));

            // 清除草稿
            localStorage.removeItem("note_draft");

            showSaveTip("🎉备忘录保存成功");
            // 短暂延迟，让提示浮层显示完再跳转
            setTimeout(()=>{
                location.href = "index.html";
            },1300);
        }

        function goBack(){
            clearTimeout(autoSaveTimer);
            location.href = "index.html";
        }
    </script>
</body>
</html>
