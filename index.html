<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>备忘录</title>
    <style>
        /* 全局效果 */
        body {
            margin: 0;
            min-height: 100vh;
            background: url("冰公主2.jpg") center/cover no-repeat;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        /* 舞台容器：绝对定位参照物，原图2500×1600，比例25/16 */
        .stage{
            position:relative;
            width:100%;
            max-width:1200px;
            aspect-ratio: 25 / 16;
        }
        .button-group{
            position:absolute;
            left: 18%;
            top: 55%;
            display: flex;
            flex-direction: column;
            gap: clamp(16px,4vw,36px);
        }
        /* 样式直接写在a标签上，不再用button */
        .button{
            display:block;
            text-align:center;
            text-decoration:none;
            padding: clamp(14px,3vw,32px) clamp(28px,6vw,55px);
            font-size: clamp(16px,3vw,26px);
            border: none;
            border-radius: 20px;
            background: linear-gradient(45deg, #b3a4ab, #7790b2);
            color: white;
            cursor: pointer;
        }
        /* 当鼠标放到button时的触发效果 */
        .button:hover{
            transform: scale(1.05);
            background-color: #2266bb;
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="button-group">
            <a class="button" href="upload.html">上传文件</a>
            <a class="button" href="newtxt.html">新建备忘录</a>
            <a class="button" href="warehouse.html">查看已有仓库</a>
        </div>
    </div>
</body>
</html>
