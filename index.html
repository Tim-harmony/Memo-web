<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>备忘录</title>
    <style>
        /* 全局效果 */
        body {
            background-image: url("冰公主2.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            margin: 0;
            min-height: 100vh;
        }
        .button-group{
            position:absolute;
            left: 18%;
            top: 55%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .button{
            /* 宽和长 */
            padding: 30px 50px;
            font-size: 24px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(45deg, #b3a4ab, #7790b2);
            color: white;
            cursor: pointer;
        }
        /* 当鼠标放到button时的触发效果 */
        .button:hover{
            transform: scale(1.05);
            background-color: #2266bb;
        }
    </style>
</head>
<body>
    <div class="button-group">
        <!-- a标签：点击跳转到 new.html -->
        <a href="upload.html" style="text-decoration:none;">
            <button class="button">上传文件</button>
        </a>
        <a href="newtxt.html" style="text-decoration:none;">
            <button class="button">新建备忘录</button>
        </a>
        <a href="warehouse.html" style="text-decoration:none;">
            <button class="button">查看已有仓库</button>
        </a>
    </div>
</body>
</html>
