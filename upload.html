<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传TXT文件</title>
    <style>
        body {
            background-image: url("冰公主4.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            width: 55%;
            margin: 0 auto;
            padding-top: 120px;
            text-align: center;
        }
        h2 {
            color: transparent;
            background: linear-gradient(45deg, #ffb6c1, #87cefa);
            -webkit-background-clip: text;
            background-clip: text;
            font-size: 30px;
        }
        .upload-wrap{
            background:rgba(255,255,255,0.22);
            backdrop-filter: blur(8px);
            border-radius:16px;
            padding:40px 20px;
            margin-top:30px;
            border:3px solid transparent;
            transition: border-color 0.25s;
        }
        .upload-wrap.drag-over{
            border-color: #87cefa;
        }
        input[type="file"]{
            color:#ffffff;
        }
        .tip-text{
            color:#fff;
            font-size:17px;
            margin:20px 0;
        }
        .btn-back{
            margin-top:30px;
            padding:14px 30px;
            font-size:18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #9999aa, #7788aa);
            color: white;
            cursor: pointer;
            transition:0.2s;
        }
        .btn-back:hover{
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>上传本地TXT备忘录</h2>
        <div class="upload-wrap" id="dropBox">
            <div class="tip-text">仅支持上传 .txt 文本文件<br>可将txt文件拖拽到此区域</div>
            <input type="file" id="fileInput" accept=".txt">
        </div>
        <br>
        <button class="btn-back" onclick="location.href='index.html'">返回主页</button>
    </div>
    <script>
        const fileInput = document.getElementById("fileInput");
        const dropBox = document.getElementById("dropBox");

        // =========关键：全局阻止整个页面拖拽文件浏览器打开的行为=========
        ["dragenter","dragover","dragleave","drop"].forEach(eventName=>{
            document.body.addEventListener(eventName, e=>{
                e.preventDefault();
                e.stopPropagation();
            })
        });

        fileInput.onchange = function(e){
            const file = e.target.files[0];
            if(!file) return;
            handleFile(file);
        }

        dropBox.addEventListener("dragenter",()=>{
            dropBox.classList.add("drag-over");
        });
        dropBox.addEventListener("dragover",()=>{
            dropBox.classList.add("drag-over");
        });
        dropBox.addEventListener("dragleave",(e)=>{
            // 判断是否真的离开盒子，避免子元素闪烁
            if(!dropBox.contains(e.relatedTarget)){
                dropBox.classList.remove("drag-over");
            }
        });

        dropBox.addEventListener("drop",(e)=>{
            // drop事件第一时间阻止默认！防止浏览器打开文件
            e.preventDefault();
            e.stopPropagation();
            dropBox.classList.remove("drag-over");
            const file = e.dataTransfer.files[0];
            if(!file) return;
            handleFile(file);
        });


        function handleFile(file){
            if(!file.name.endsWith(".txt")){
                alert("只能选择txt格式文件!");
                fileInput.value = "";
                return;
            }
            const reader = new FileReader();
            reader.onload = function(event){
                const txtContent = event.target.result;
                if(!txtContent.trim()){
                    alert("txt文件内容为空,无法导入!");
                    fileInput.value = "";
                    return;
                }
                let title = file.name.replace(".txt","");
                let noteList = JSON.parse(localStorage.getItem("notes")) || [];
                let newNote = {
                    id: Date.now(),
                    title: title,
                    content: txtContent,
                    time: new Date().toLocaleString()
                };
                noteList.push(newNote);
                localStorage.setItem("notes", JSON.stringify(noteList));

                alert("✅导入成功！已存入仓库");
                fileInput.value = "";
                // 【没有跳转！停留在上传页面】
            }
            reader.readAsText(file);
        }
    </script>
</body>
</html>
